# Strands puzzle config — Mom's Birthday
# Run: python generate_puzzle.py puzzles/moms_birthday.yaml

theme: "Words That Describe Mom"

# The spangram must span the grid from left edge to right edge.
# It should capture the overall theme in one word or phrase.
spangram: "EXTRAORDINARY"

# Theme words. IMPORTANT: total letters across words + spangram must equal
# exactly 48 (6x8 grid) — every cell belongs to a word, no random fill letters.
# EXTRAORDINARY(13) + LOVING(6) + CARING(6) + FUNNY(5) + WISE(4) + WARM(4)
#   + KIND(4) + GENTLE(6) = 48
words:
  - LOVING
  - CARING
  - FUNNY
  - WISE
  - WARM
  - KIND
  - GENTLE

# Optional metadata shown on the win screen
author: "Your Name"
date: "Mom's Birthday"
